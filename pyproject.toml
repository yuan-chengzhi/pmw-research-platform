[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmw-research-platform"
version = "0.1.0"
description = "A small session runtime for persistent mathematical research worlds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pmw = [
  "persistent-mathematical-worlds @ git+https://github.com/yuan-chengzhi/persistent-mathematical-worlds.git@4880f184c60bd34181302c5343ec0db95f154851"
]
dev = ["pytest>=8"]

[project.scripts]
pmw-research = "pmw_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pmw_platform = ["locks/*.json", "profiles/*.json", "runtime/*.mjs"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
